<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070d" />
      <stop offset="50%" stop-color="#0f1123" />
      <stop offset="100%" stop-color="#05050a" />
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(0, 255, 136, 0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="140" fill="#00ff88" opacity="0.08" filter="url(#neonGlow)" />
  <circle cx="1000" cy="420" r="160" fill="#a855f7" opacity="0.08" filter="url(#neonGlow)" />

  <!-- Outer Border Frame -->
  <rect x="25" y="25" width="1150" height="580" rx="16" fill="none" stroke="url(#cyberGrad)" stroke-width="2" opacity="0.6" />

  <!-- Platform Badge Pill -->
  <g transform="translate(100, 100)">
    <rect width="360" height="42" rx="21" fill="rgba(0, 255, 136, 0.1)" stroke="#00ff88" stroke-width="1" />
    <circle cx="24" cy="21" r="6" fill="#00ff88" filter="url(#neonGlow)" />
    <text x="42" y="27" fill="#00ff88" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" letter-spacing="1">⚡ O'ZBEKISTON DASTURLASH PLATFORMASI</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="220" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    CODE<tspan fill="#00ff88">DUEL</tspan>
  </text>
  <text x="490" y="220" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900">
    ARENA
  </text>

  <!-- Subtitle -->
  <text x="100" y="290" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600">
    Dasturlashni 100% Amaliyotda O'rganing va Kod Janglarida Kuch Sinashing
  </text>

  <text x="100" y="340" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20">
    180+ Interaktiv Darslar (HTML, CSS, JS, Python) • AI Murabbiy • Jonli Natijalar • Rasmiy Sertifikatlar
  </text>

  <!-- Feature Cards Row -->
  <g transform="translate(100, 410)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="300" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
    <text x="24" y="44" fill="#00ff88" font-size="24">📚 180+ Darslar</text>
    <text x="24" y="80" fill="#94a3b8" font-size="15" font-family="sans-serif">Frontend &amp; Backend yo'nalishlari</text>

    <!-- Card 2 -->
    <rect x="330" y="0" width="300" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
    <text x="354" y="44" fill="#38bdf8" font-size="24">⚔️ Real-Time Duel</text>
    <text x="354" y="80" fill="#94a3b8" font-size="15" font-family="sans-serif">Dasturchilar bilan jonli poyga</text>

    <!-- Card 3 -->
    <rect x="660" y="0" width="340" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
    <text x="684" y="44" fill="#a855f7" font-size="24">🤖 Coddy AI Murabbiy</text>
    <text x="684" y="80" fill="#94a3b8" font-size="15" font-family="sans-serif">Xatolarni tushuntiruvchi shaxsiy ustoz</text>
  </g>

  <!-- Footer URL -->
  <text x="1100" y="575" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="16" text-anchor="end">
    https://codeduel.tech
  </text>
</svg>
