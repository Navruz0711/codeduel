<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e101f" />
      <stop offset="100%" stop-color="#06070d" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyber Hexagon Shield Background -->
  <polygon points="32,3 59,17 59,47 32,61 5,47 5,17" fill="url(#bgGrad)" stroke="url(#cyberGrad)" stroke-width="2.5" />

  <!-- Inner Tech Circuit Accents -->
  <polygon points="32,7 55,19 55,45 32,57 9,45 9,19" fill="none" stroke="rgba(0, 255, 136, 0.2)" stroke-width="1" />

  <!-- Glowing Lightning / Code Symbol -->
  <path d="M36 12 L20 34 L31 34 L26 52 L44 28 L33 28 Z" fill="url(#cyberGrad)" filter="url(#neonGlow)" />
</svg>
